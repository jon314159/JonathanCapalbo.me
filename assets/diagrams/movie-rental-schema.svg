<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Published Oracle movie rental schema: keys and relationships</title>
  <desc id="desc">Six tables and five foreign keys. Actors actor_id and movies title_id are referenced by star_billings, whose composite primary key is title_id and actor_id. Movies title_id is referenced by media title_id. Media media_id and customers customer_id are referenced by rental_history, whose primary key is media_id and rental_date. Each relationship is exactly one parent to zero or more children. All foreign keys are required. Non-key attributes are omitted.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#0b1f33}.box{fill:#fbfaf6;stroke:#5e6b76;stroke-width:1.5}.heading{font-size:23px;font-weight:700}.key{font-size:20px}.rule{stroke:#d8d8d1}.edge{stroke:#2147be;stroke-width:2.5;fill:none}.count{font-size:19px;fill:#2147be;font-weight:650}</style>
  <path class="edge" d="M195 140V255 M195 520V410 M705 140V255 M705 520V410 M365 575H535"/>
  <g class="count"><text x="210" y="171">1</text><text x="210" y="239">0..*</text><text x="210" y="500">1</text><text x="210" y="441">0..*</text><text x="720" y="171">1</text><text x="720" y="239">0..*</text><text x="720" y="500">1</text><text x="720" y="441">0..*</text><text x="382" y="562">1</text><text x="482" y="562">0..*</text></g>
  <g class="box"><rect x="25" y="30" width="340" height="110" rx="10"/><rect x="535" y="30" width="340" height="110" rx="10"/><rect x="25" y="255" width="340" height="155" rx="10"/><rect x="535" y="255" width="340" height="155" rx="10"/><rect x="25" y="520" width="340" height="110" rx="10"/><rect x="535" y="520" width="340" height="110" rx="10"/></g>
  <path class="rule" d="M25 85H365 M535 85H875 M25 310H365 M535 310H875 M25 575H365 M535 575H875"/>
  <g class="heading"><text x="45" y="65">actors</text><text x="555" y="65">customers</text><text x="45" y="290">star_billings</text><text x="555" y="290">rental_history</text><text x="45" y="555">movies</text><text x="555" y="555">media</text></g>
  <g class="key"><text x="45" y="119">PK actor_id</text><text x="555" y="119">PK customer_id</text><text x="45" y="344">PK, FK title_id → movies</text><text x="45" y="378">PK, FK actor_id → actors</text><text x="555" y="339">PK, FK media_id → media</text><text x="555" y="369">PK rental_date</text><text x="555" y="399">FK customer_id → customers</text><text x="45" y="609">PK title_id</text><text x="555" y="600">PK media_id</text><text x="555" y="625">FK title_id → movies</text></g>
</svg>
