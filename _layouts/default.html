<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=48" />
  </head>
  <body id="top">
    <header>
      <nav aria-label="Main navigation">
        <a href="{{ '/#top' | relative_url }}">About</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#skills' | relative_url }}">Skills</a>
        <a href="{{ '/#education' | relative_url }}">Education</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p><strong>Jonathan Capalbo</strong><span>Business analysis · Reporting · Operations · Systems</span></p>
      <p>&copy; {{ site.time | date: '%Y' }} Jonathan Capalbo.</p>
    </footer>
  </body>
</html>
