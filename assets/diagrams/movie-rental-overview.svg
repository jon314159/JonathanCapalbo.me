<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="title desc">
  <title id="title">Movie rental schema overview</title>
  <desc id="desc">Actors and movies each have zero or more star_billings. Movies have zero or more media copies. Customers and media each have zero or more rental_history records. Every child record requires exactly one parent on each relationship. Keys are shown in the detailed case-study diagram.</desc>
